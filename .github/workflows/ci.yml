name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Display GitHub context
      # --------------------------------------------------
      - name: Check GitHub repository context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"

      # --------------------------------------------------
      # 3. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------
      # 4. Install backend dependencies
      # --------------------------------------------------
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      # --------------------------------------------------
      # 5. Configure AWS using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-CloudDeploy

      # --------------------------------------------------
      # 6. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------
      # 7. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 8. Define Docker image names
      # --------------------------------------------------
      - name: Define Docker image names
        run: |
          echo "BACKEND_IMAGE=${{ steps.login-ecr.outputs.registry }}/clouddeploy-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${{ steps.login-ecr.outputs.registry }}/clouddeploy-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Build backend Docker image
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${BACKEND_IMAGE}:latest" \
            ./backend

      # --------------------------------------------------
      # 10. Build frontend Docker image
      # --------------------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -t "${FRONTEND_IMAGE}:latest" \
            ./frontend

      # --------------------------------------------------
      # 11. Push backend images to ECR
      # --------------------------------------------------
      - name: Push backend images to ECR
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"

      # --------------------------------------------------
      # 12. Push frontend images to ECR
      # --------------------------------------------------
      - name: Push frontend images to ECR
        run: |
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

      # --------------------------------------------------
      # 13. Deploy to EC2 using AWS Systems Manager
      # --------------------------------------------------
      - name: Deploy to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0e71192a54db9d7dc \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 842675971897.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 842675971897.dkr.ecr.us-east-1.amazonaws.com/clouddeploy-backend:'"${GITHUB_SHA}"'",
              "docker pull 842675971897.dkr.ecr.us-east-1.amazonaws.com/clouddeploy-frontend:'"${GITHUB_SHA}"'",
              "docker rm -f clouddeploy-backend || true",
              "docker rm -f clouddeploy-frontend || true",
              "docker run -d --name clouddeploy-backend --restart unless-stopped -p 3001:8080 842675971897.dkr.ecr.us-east-1.amazonaws.com/clouddeploy-backend:'"${GITHUB_SHA}"'",
              "docker run -d --name clouddeploy-frontend --restart unless-stopped -p 8080:80 842675971897.dkr.ecr.us-east-1.amazonaws.com/clouddeploy-frontend:'"${GITHUB_SHA}"'",
              "docker ps"
            ]' \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 14. Wait for deployment
      # --------------------------------------------------
      - name: Wait for deployment
        run: |
          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e71192a54db9d7dc \
            --region us-east-1

      # --------------------------------------------------
      # 15. Verify application health
      # --------------------------------------------------
      - name: Verify application health
        run: |
          echo "========================================"
          echo "Verifying CloudDeploy application health"
          echo "========================================"

          HEALTH_COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0e71192a54db9d7dc \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo Checking Nginx...",
              "sudo systemctl is-active --quiet nginx",
              "echo Nginx: OK",
              "echo Checking backend container...",
              "docker inspect -f \"{{.State.Running}}\" clouddeploy-backend | grep -q true",
              "echo Backend container: OK",
              "echo Checking frontend container...",
              "docker inspect -f \"{{.State.Running}}\" clouddeploy-frontend | grep -q true",
              "echo Frontend container: OK",
              "echo Checking frontend endpoint...",
              "curl -fsS http://localhost/",
              "echo",
              "echo Frontend endpoint: OK",
              "echo Checking backend health endpoint...",
              "curl -fsS http://localhost/api/health",
              "echo",
              "echo Backend health endpoint: OK",
              "echo Application health check passed."
            ]' \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "Health check command ID: $HEALTH_COMMAND_ID"

          echo "Waiting for health check..."

          aws ssm wait command-executed \
            --command-id "$HEALTH_COMMAND_ID" \
            --instance-id i-0e71192a54db9d7dc \
            --region us-east-1

          HEALTH_STATUS=$(aws ssm get-command-invocation \
            --command-id "$HEALTH_COMMAND_ID" \
            --instance-id i-0e71192a54db9d7dc \
            --region us-east-1 \
            --query 'Status' \
            --output text)

          echo "Health check status: $HEALTH_STATUS"

          aws ssm get-command-invocation \
            --command-id "$HEALTH_COMMAND_ID" \
            --instance-id i-0e71192a54db9d7dc \
            --region us-east-1 \
            --query '[StandardOutputContent,StandardErrorContent]' \
            --output text

          if [ "$HEALTH_STATUS" != "Success" ]; then
            echo "Application health check failed."
            exit 1
          fi

          echo "========================================"
          echo "Application health check passed"
          echo "========================================"

      # --------------------------------------------------
      # 16. Show deployment result
      # --------------------------------------------------
      - name: Deployment result
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0e71192a54db9d7dc \
            --region us-east-1

      # --------------------------------------------------
      # 17. Deployment summary
      # --------------------------------------------------
      - name: Deployment summary
        run: |
          echo "========================================"
          echo "CloudDeploy deployment completed"
          echo "========================================"
          echo "Commit: ${GITHUB_SHA}"
          echo ""
          echo "Backend:"
          echo "${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo ""
          echo "Frontend:"
          echo "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          echo ""
          echo "EC2:"
          echo "i-0e71192a54db9d7dc"
          echo ""
          echo "Application:"
          echo "http://34.231.241.117/"
          echo ""
          echo "Health:"
          echo "http://34.231.241.117/api/health"
          echo "========================================"
